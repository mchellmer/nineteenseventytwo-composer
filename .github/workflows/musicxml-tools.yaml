name: musicxml-tools

on:
  push:
    paths:
      - 'services/musicxml-tools/**'
    branches: [main]
  pull_request:
    paths:
      - 'services/musicxml-tools/**'

jobs:
  test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: services/musicxml-tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=musicxml_tools

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: services/musicxml-tools
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t musicxml-tools:${{ steps.version.outputs.version }} .
          docker tag musicxml-tools:${{ steps.version.outputs.version }} musicxml-tools:latest
