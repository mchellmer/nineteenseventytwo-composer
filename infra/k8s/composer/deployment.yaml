apiVersion: apps/v1
kind: Deployment
metadata:
  name: composer
  labels:
    app: composer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: composer
  template:
    metadata:
      labels:
        app: composer
    spec:
      # Run composer on the PC node (needs access to llm-server)
      nodeSelector:
        workload: llm
      containers:
        - name: composer
          image: composer:latest  # Overridden by CI/CD with versioned tag
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LLM_BASE_URL
              value: "http://llm-server:11434"
            - name: LLM_MODEL
              value: "llama3:8b"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
