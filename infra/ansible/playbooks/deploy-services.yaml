---
# Deploy all services to the K8s cluster
- name: Deploy composer services
  hosts: localhost
  connection: local
  vars:
    registry: # <your-registry>
    namespace: composer
  tasks:
    - name: Ensure namespace exists
      ansible.builtin.command:
        cmd: kubectl apply -f ../../k8s/namespace.yaml

    - name: Deploy llm-server
      ansible.builtin.command:
        cmd: kubectl apply -f ../../services/llm-server/k8s/ -n {{ namespace }}

    - name: Deploy composer service
      ansible.builtin.command:
        cmd: kubectl apply -f ../../infra/k8s/composer/ -n {{ namespace }}
